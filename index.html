<h2 class="sr-only">An interactive register of a personal book collection: roughly 340 titles catalogued across three bookcase units, searchable and filterable, with a list of uncertain spines needing manual checking.</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#br .row{display:flex;gap:12px;padding:9px 2px;border-bottom:0.5px solid var(--border);align-items:baseline}
#br .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px}
#br .chip{padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:20px;background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer}
#br .chip[aria-pressed=true]{background:var(--fill-accent);color:var(--on-accent);border-color:var(--fill-accent)}
#br .sh{font-size:13px;color:var(--text-secondary);margin:26px 0 6px;padding-bottom:5px;border-bottom:0.5px solid var(--border-strong)}
#br li{margin-bottom:10px;font-size:14px;line-height:1.6}
</style>

<div id="br" style="padding:1rem 0">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-bottom:1.25rem">
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem"><div style="font-size:13px;color:var(--text-secondary)">Titles</div><div id="s1" style="font-size:24px;font-weight:500">—</div></div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem"><div style="font-size:13px;color:var(--text-secondary)">Authors</div><div id="s2" style="font-size:24px;font-weight:500">—</div></div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem"><div style="font-size:13px;color:var(--text-secondary)">To check</div><div id="s3" style="font-size:24px;font-weight:500">—</div></div>
  </div>

  <input type="search" id="q" placeholder="Search author or title" style="width:100%;margin-bottom:10px">
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">
    <button class="chip" data-f="all" aria-pressed="true">Everything</button>
    <button class="chip" data-f="A" aria-pressed="false">Unit A</button>
    <button class="chip" data-f="B" aria-pressed="false">Unit B</button>
    <button class="chip" data-f="C" aria-pressed="false">Unit C</button>
    <button class="chip" data-f="check" aria-pressed="false">Needs checking</button>
    <button class="chip" data-f="az" aria-pressed="false">A–Z by author</button>
    <button class="chip" data-f="fix" aria-pressed="false">Fix list</button>
  </div>
  <div style="display:flex;gap:16px;margin:10px 0 4px;font-size:12px;color:var(--text-muted)">
    <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-success);margin-right:5px"></span>Confirmed</span>
    <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-warning);margin-right:5px"></span>Probable</span>

  </div>
  <div id="out"></div>
</div>

C|5|all|Largest gap overall. Left third hidden by the chair; roughly fifteen spines unreadable. The Pollan and the Slater are visible but untitled. Worth reshooting on its own with the chair moved and a light held low.`;

const UN={A:'Unit A',B:'Unit B',C:'Unit C'};
const UNL={A:'Unit A, the first bookcase',B:'Unit B, centre and corner column',C:'Unit C, right-hand column'};
const DOT={H:'var(--text-success)',M:'var(--text-warning)',L:'var(--text-danger)'};
const books=RAW.split('\n').map(l=>{const p=l.split('|');return{a:p[0],t:p[1],u:p[2],s:+p[3],p:p[4],c:p[5]}});
const fixes=FIXES.split('\n').map(l=>{const p=l.split('|');return{u:p[0],s:p[1],p:p[2],n:p[3]}});
document.getElementById('s1').textContent=books.length;
document.getElementById('s2').textContent=new Set(books.map(b=>b.a).filter(a=>a!=='unidentified')).size;
document.getElementById('s3').textContent=books.filter(b=>b.c!=='H').length;
const out=document.getElementById('out');
let mode='all',q='';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function row(b){
  const unk=b.t==='unidentified';
  const ttl=unk?'<span style="color:var(--text-danger);font-size:14px">Title not legible</span>'
    :'<span style="font-family:var(--font-voice);font-size:16px">'+esc(b.t)+'</span>';
  const aut=b.a==='unidentified'?'Author not legible':esc(b.a);
  return '<div class="row"><span class="dot" style="background:'+DOT[b.c]+'"></span>'
    +'<div style="flex:1;min-width:0">'+ttl
    +'<span style="display:block;font-size:13px;color:var(--text-secondary)">'+aut+'</span></div>'
    +'<span style="flex:none;font-size:12px;color:var(--text-muted)">'+b.u+'&middot;'+b.s+'</span></div>';
}
function render(){
  if(mode==='fix'){
    let h='<p style="font-size:14px;color:var(--text-secondary);margin:1.25rem 0 0">Each entry says where the book sits relative to its neighbours. Work left to right along the shelf and the position numbers should line up.</p>';
    ['A','B','C'].forEach(u=>{
      h+='<div class="sh">'+UNL[u]+'</div><ul style="padding-left:1.1rem;margin:0">';
      fixes.filter(f=>f.u===u).forEach(f=>{h+='<li><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent)">Shelf '+f.s+', pos '+f.p+'</code> '+esc(f.n)+'</li>'});
      h+='</ul>'});
    out.innerHTML=h;return;
  }
  let l=books.slice();
  if(mode==='A'||mode==='B'||mode==='C')l=l.filter(b=>b.u===mode);
  if(mode==='check')l=l.filter(b=>b.c!=='H');
  if(q)l=l.filter(b=>(b.a+' '+b.t).toLowerCase().includes(q));
  if(!l.length){out.innerHTML='<p style="color:var(--text-muted);padding:2.5rem 0;text-align:center">Nothing on the shelves matches that.</p>';return}
  if(mode==='az'||q){
    l.sort((x,y)=>x.a.localeCompare(y.a)||x.t.localeCompare(y.t));
    out.innerHTML='<div class="sh">'+l.length+' title'+(l.length>1?'s':'')+'</div>'+l.map(row).join('');return;
  }
  let h='',cur='';
  l.forEach(b=>{const k=b.u+b.s;if(k!==cur){cur=k;h+='<div class="sh">'+UN[b.u]+', shelf '+b.s+'</div>'}h+=row(b)});
  out.innerHTML=h;
}
document.querySelectorAll('#br .chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('#br .chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true');mode=c.dataset.f;render()}));
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
render();
</script>
